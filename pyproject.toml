[project]
name = "apache-spark-minio"
version = "0.1.0"
description = ""
authors = [
    {name = "Mateus Salles Melo",email = "mateussallesmelo@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark (>=4.2.0,<5.0.0)",
    "delta-spark (>=4.4.1,<5.0.0)",
    "install-jdk (>=1.1.0,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pyodbc (>=5.3.0,<6.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "boto3 (>=1.43.111,<2.0.0)"
]

[tool.poetry]
packages = [{include = "apache_spark_minio", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyterlab (>=4.6.4,<5.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)"
]
